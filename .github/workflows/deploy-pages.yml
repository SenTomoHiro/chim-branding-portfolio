name: Deploy GitHub Pages
run-name: ${{ github.event_name == 'repository_dispatch' && format('Admin PDF {0} · {1}', github.event.client_payload.request_id, github.event.client_payload.target) || format('Deploy {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types:
      - admin_pdf_generate

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /chim-branding-portfolio
          SITE_URL: https://sentomohiro.github.io/chim-branding-portfolio
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
