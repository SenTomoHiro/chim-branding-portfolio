name: Deploy GitHub Pages
run-name: Deploy ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths-ignore:
      - data/content.json
      - data/pdf-cache.json
      - public/media/cases/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /chim-branding-portfolio
          NEXT_PUBLIC_CONTENT_ORIGIN: https://raw.githubusercontent.com/SenTomoHiro/chim-branding-portfolio/main
          NEXT_PUBLIC_PDF_ORIGIN: https://github.com/SenTomoHiro/chim-branding-portfolio/releases/download/pdf-cache
          SITE_URL: https://sentomohiro.github.io/chim-branding-portfolio
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
