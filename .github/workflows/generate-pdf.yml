name: Generate PDF
run-name: PDF ${{ github.event.client_payload.target }} · ${{ github.event.client_payload.request_id }}

on:
  repository_dispatch:
    types:
      - admin_pdf_generate

permissions:
  contents: write

concurrency:
  group: pdf-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PDF_TARGET: ${{ github.event.client_payload.target }}
      SITE_ORIGIN: https://sentomohiro.github.io/chim-branding-portfolio
      NEXT_PUBLIC_BASE_PATH: /chim-branding-portfolio
      NEXT_PUBLIC_CONTENT_ORIGIN: https://raw.githubusercontent.com/SenTomoHiro/chim-branding-portfolio/main
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate target
        run: node -e 'if (!/^(?:design|photography|category:(?:food|drinks|ip|other)|case:[A-Za-z0-9_-]+)$/.test(process.env.PDF_TARGET || "")) throw new Error("Invalid PDF target")'
      - run: npm ci
      - name: Preserve source content
        run: cp data/content.json "$RUNNER_TEMP/pdf-source-content.json"
      - name: Generate one PDF
        run: node scripts/generate-pdfs.mjs --origin "$SITE_ORIGIN$NEXT_PUBLIC_BASE_PATH" --output-dir output/pdf --content "$RUNNER_TEMP/pdf-source-content.json" --target "$PDF_TARGET"
      - name: Resolve generated file
        id: pdf
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const target = process.env.PDF_TARGET;
          const filename = target.startsWith("case:") ? `${target.slice(5).toLowerCase()}.pdf` : target.startsWith("category:") ? `portfolio-design-${target.slice(9)}.pdf` : `portfolio-${target}.pdf`;
          const file = target.startsWith("case:") ? `output/pdf/cases/${filename}` : `output/pdf/${filename}`;
          console.log(`filename=${filename}`);
          console.log(`file=${file}`);
          NODE
      - name: Upload stable release asset
        env:
          PDF_FILE: ${{ steps.pdf.outputs.file }}
          PDF_FILENAME: ${{ steps.pdf.outputs.filename }}
        run: |
          gh release view pdf-cache >/dev/null 2>&1 || gh release create pdf-cache --title "PDF Cache" --notes "Current on-demand portfolio PDF cache." --latest=false
          gh release upload pdf-cache "$PDF_FILE#$PDF_FILENAME" --clobber
      - name: Update cache manifest
        run: |
          git pull --rebase origin main
          npx tsx scripts/update-pdf-cache.ts --target "$PDF_TARGET" --content "$RUNNER_TEMP/pdf-source-content.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/pdf-cache.json
          git commit -m "Update PDF cache: $PDF_TARGET"
          git push origin HEAD:main
